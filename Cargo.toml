[workspace]
resolver = "3"
members = ["crates/c2-data", "crates/c2-engine", "crates/c2-census", "crates/c2-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
c2-census = { path = "crates/c2-census" }
c2-data = { path = "crates/c2-data" }
c2-engine = { path = "crates/c2-engine" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19", default-features = false, features = ["std", "cublas", "cublaslt", "driver", "nvrtc", "dynamic-loading", "cuda-13020", "f16"] }
gemm = "0.19"
half = "2"
serde_json = "1"
memmap2 = "0.9"
rayon = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = "thin"
