[project]
name = "stockai"
version = "0.1.0"
description = "Small GPT-style models trained on stock price history, graded by correlation2's holdout test"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.14.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "lightgbm>=4.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stockai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
